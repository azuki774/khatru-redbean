name: Go

on:
  push:
    branches:
      - "**"
  workflow_call:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: | 
          go mod download
          make setup

      - name: Run tests
        run: make check

      - name: Build binary
        run: make bin GOARCH=${{ matrix.goarch }}
